<!doctype html>
<html lang="zh-Hant">

    <link rel="canonical" href="https://pamela72.com/menu-design.html">
    <meta property="og:title" content="菜單設計作品｜Pamela Creative Studio">
    <meta property="og:description" content="Pamela Creative Studio 菜單設計作品，展示精品咖啡菜單與店內情境，點擊圖片欣賞完整菜單。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pamela72.com/menu-design.html">
    <meta property="og:image" content="https://pamela72.com/assets/images/menu-design/coffee-menu-preview.webp">
    <meta property="og:image:alt" content="精品咖啡菜單與咖啡館情境展示">
    <meta property="og:locale" content="zh_TW">
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
    <script>document.documentElement.classList.add("has-js","is-loading")</script>
    <link rel="stylesheet" href="css/style.css?v=20261013-scroll-reveal-v2">
    <script src="js/main.js?v=20261022-remove-memorial" defer></script>
  <style>
      .menu-preview { display:block; width:100%; padding:0; border:0; background:none; cursor:zoom-in; }
      .menu-preview:focus-visible { outline:3px solid #76533b; outline-offset:6px; }
      .menu-detail { width:min(630px, calc(100vw - 32px)); max-width:none; max-height:calc(100dvh - 48px); padding:0; border:0; background:#fff; overflow:auto; }
      .menu-detail::backdrop { background:rgba(0,0,0,.65); }
      .menu-detail__bar { position:sticky; top:0; display:flex; justify-content:flex-end; padding:8px; background:#fff; z-index:1; }
      .menu-detail__close { width:38px; height:38px; padding:0; border:0; border-radius:50%; background:#222; color:#fff; font-size:28px; cursor:pointer; }
      .menu-detail img { display:block; width:100%; height:auto; }
      html:has(.menu-detail[open]) { overflow:hidden; }
      img { -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
    </style>
    <script src="js/menu-design.js?v=20261017-image-protection" defer></script>
  </head>
  <body>
    <div class="loading-screen" role="status" aria-live="polite">
      <div class="loading-screen__brand">Pamela Creative Studio</div>
      <p class="loading-screen__message">載入中，請稍等...</p>
      <img class="loading-screen__cat" src="assets/images/menu-design/loading-cat.webp?v=20261017" alt="" width="135" height="135" draggable="false">
    </div>
    <div data-site-header></div>
    <main>
      <section class="project-gallery project-gallery--print project-gallery--menu page-shell" aria-labelledby="project-title">
        <h1 id="project-title" class="sr-only">菜單設計作品</h1>
        <div class="project-gallery__content">
          <button class="menu-preview" type="button" aria-label="開啟完整精品咖啡菜單" aria-haspopup="dialog" aria-controls="menu-detail">
            <img src="assets/images/menu-design/coffee-menu-preview.webp" alt="精品咖啡菜單與咖啡館情境展示，點擊欣賞完整菜單" width="1536" height="1024" decoding="async" fetchpriority="high" draggable="false">
          </button>
        </div>
      </section>
    </main>
    <dialog class="menu-detail" id="menu-detail" aria-label="完整精品咖啡菜單">
      <div class="menu-detail__bar"><button class="menu-detail__close" type="button" aria-label="關閉菜單視窗" autofocus>×</button></div>
      <img src="assets/images/menu-design/coffee-menu-full.webp" alt="完整精品咖啡菜單：特調精品咖啡與手沖精品咖啡品項及價格" width="1240" height="1740" loading="lazy" decoding="async" draggable="false">
    </dialog>
    <div data-site-footer></div>
  </body>
</html>
