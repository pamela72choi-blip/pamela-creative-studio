</div><section class="page-seo-note" aria-label="照片修復與回憶"><p>這些老照片，是我跟已故的親人、毛孩一起留下的回憶 。<br>時間久了，畫面變得模糊、顏色也褪了。<br>我會用修圖軟體加上 AI 輔助，把清晰度、色彩和細節一點一點找回來。<br>他們雖然不在身邊了，但那些熟悉的樣子還在，<br>想念的時候看一眼，好像他們從來沒有走遠。</p></section></section></main><div data-site-footer></div></body></html>
