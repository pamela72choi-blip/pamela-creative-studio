<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutorial Videos | Pamela Creative Studio</title>
    <meta name="description" content="Pamela Creative Studio 的教學影片作品。">
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div data-site-header></div>
    <main>
      <section class="project-videos page-shell" aria-labelledby="project-title">
        <h1 id="project-title" class="sr-only">Tutorial Videos</h1>
        <div class="project-videos__stack">
          <button class="project-detail-trigger video-preview" type="button" data-video-preview="assets/videos/tutorial-videos/tutorial-videos_01.mp4" aria-label="播放教學影片作品 1">
            <img src="tutorial-videos/tutorial-videos-cover_01.webp" alt="教學影片作品 1 預覽圖" width="620" height="320">
          </button>
          <button class="project-detail-trigger video-preview" type="button" data-video-preview="assets/videos/tutorial-videos/tutorial-videos_02.mp4" aria-label="播放教學影片作品 2">
            <img src="tutorial-videos/tutorial-videos-cover_02.webp" alt="教學影片作品 2 預覽圖" width="620" height="320" loading="lazy">
          </button>
          <button class="project-detail-trigger video-preview" type="button" data-video-preview="assets/videos/tutorial-videos/tutorial-videos_03.mp4" aria-label="播放教學影片作品 3">
            <img src="tutorial-videos/tutorial-videos-cover_03.webp" alt="教學影片作品 3 預覽圖" width="620" height="320" loading="lazy">
          </button>
          <button class="project-detail-trigger video-preview" type="button" data-video-preview="assets/videos/tutorial-videos/tutorial-videos_04.mp4" aria-label="播放教學影片作品 4">
            <img src="tutorial-videos/tutorial-videos-cover_04.webp" alt="教學影片作品 4 預覽圖" width="620" height="320" loading="lazy">
          </button>
          <button class="project-detail-trigger video-preview" type="button" data-video-preview="assets/videos/tutorial-videos/tutorial-videos_05.mp4" aria-label="播放教學影片作品 5">
            <img src="tutorial-videos/tutorial-videos-cover_05.webp" alt="教學影片作品 5 預覽圖" width="620" height="320" loading="lazy">
          </button>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
</html>
