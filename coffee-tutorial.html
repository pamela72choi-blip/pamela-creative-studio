  <style id="coffee-image-protection">
  img { -webkit-touch-callout: none; -webkit-user-drag: none; user-select: none; }
</style>
<script>
// Block image context menus and dragging, including the gallery's surrounding area.
(() => {
  const protectedArea = 'img, .project-gallery__content';
  for (const type of ['contextmenu', 'dragstart']) {
    document.addEventListener(type, event => {
      if (event.target instanceof Element && event.target.closest(protectedArea)) event.preventDefault();
    }, {capture:true});
  }
})();
</script>
